<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, target-densitydpi=medium-dpi">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="build" content="${guacamole.build.identifier}">
        <base href="./">
        <link rel="icon" type="image/png" href="images/logo-64.png">
        <link rel="icon" type="image/png" sizes="144x144" href="images/logo-144.png">
        <link rel="apple-touch-icon" type="image/png" href="images/logo-144.png">
        <link rel="manifest" href="manifest.json">

        <title>Guacamole</title>

        <!-- Move any query parameters to after the "#/" such that they are
             visible to the router -->
        <script src="relocateParameters.js?b=${guacamole.build.identifier}"></script>

        <!-- Guacamole client library (provided by guacamole-common-js) -->
        <script src="guacamole-common-js/all.min.js?b=${guacamole.build.identifier}"></script>
    </head>
    <body>

        <!-- Extension CSS (must be able to override webapp CSS, which the
             Angular build injects at the end of the head) -->
        <link rel="stylesheet" type="text/css" href="app.css?b=${guacamole.build.identifier}">

        <guac-app></guac-app>
    </body>
</html>
